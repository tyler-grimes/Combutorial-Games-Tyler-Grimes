[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
engine = { path = "../engine" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.10"

[dev-dependencies]
tokio-tungstenite = "0.29"
futures-util = "0.3"
